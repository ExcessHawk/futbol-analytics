# Local PostgreSQL for development.
# Port 5450 on the host avoids clashes with other local Postgres containers.
services:
  db:
    image: postgres:17
    container_name: futbol-db
    environment:
      POSTGRES_DB: ${DB_NAME:-futbol}
      POSTGRES_USER: ${DB_USER:-futbol}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-futbol}
    ports:
      - "${DB_PORT:-5450}:5432"
    volumes:
      - futbol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-futbol} -d ${DB_NAME:-futbol}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  futbol_pgdata:
